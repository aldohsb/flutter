<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter Projects - by Aldohsb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 40%, #a5d6a7 100%);
            color: #2d3e2d;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(139, 115, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(101, 67, 33, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(165, 214, 167, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(101, 67, 33, 0.9) 0%, rgba(62, 39, 35, 0.95) 100%);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(139, 115, 85, 0.5);
        }

        h1 {
            font-size: 3em;
            color: #e8f5e9;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            font-size: 1.2em;
            color: #c8e6c9;
            font-style: italic;
        }

        .search-box {
            margin: 30px auto;
            max-width: 600px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #654321;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            color: #2d3e2d;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.2);
        }

        .search-box input::placeholder {
            color: #7a9d7a;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 1);
            border-color: #4a7c59;
            box-shadow: 0 4px 16px rgba(74, 124, 89, 0.4);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .special-projects {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 20px;
        }

        .special-card {
            background: linear-gradient(135deg, rgba(255, 235, 205, 0.95) 0%, rgba(245, 222, 179, 0.9) 100%);
            border: 3px solid #8b6914;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.4s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(139, 105, 20, 0.3);
            grid-column: span 1;
        }

        .special-card::before {
            content: '⭐';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            opacity: 0.3;
            transition: all 0.4s ease;
        }

        .special-card:hover::before {
            opacity: 0.8;
            transform: rotate(72deg) scale(1.2);
        }

        .special-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(218, 165, 32, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .special-card:hover::after {
            opacity: 1;
        }

        .special-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #daa520;
            background: linear-gradient(135deg, rgba(255, 235, 205, 1) 0%, rgba(245, 222, 179, 1) 100%);
            box-shadow: 0 15px 40px rgba(139, 105, 20, 0.5);
        }

        .special-badge {
            display: inline-block;
            background: #8b6914;
            color: white;
            font-size: 0.65em;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .special-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #3e2723;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .special-description {
            font-size: 1.1em;
            color: #5d4037;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .project-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(232, 245, 233, 0.9) 100%);
            border: 2px solid #654321;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.4s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.15);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(165, 214, 167, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: #4a7c59;
            background: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(232, 245, 233, 1) 100%);
            box-shadow: 0 12px 30px rgba(74, 124, 89, 0.3);
        }

        .project-number {
            font-size: 0.9em;
            color: #654321;
            font-weight: bold;
            margin-bottom: 8px;
            background: rgba(101, 67, 33, 0.1);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .project-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2d3e2d;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .project-description {
            font-size: 0.95em;
            color: #4a5d4a;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .stats {
            text-align: center;
            margin: 20px 0;
            color: #c5d5a8;
            font-size: 1.1em;
        }

        .zen-decoration {
            text-align: center;
            font-size: 2em;
            margin: 20px 0;
            opacity: 0.3;
        }

        @media (max-width: 1200px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .special-projects{
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                      }
        }

        @media (max-width: 768px) {
            .projects-grid, .special-projects{
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
                        
            h1 {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            
            .special-projects {
                grid-template-columns: 1fr;
            }
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #4a7c59;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍃 Flutter Projects</h1>
            <p class="subtitle">Flutter App by Aldohsb</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari proyek..." onkeyup="filterProjects()">
        </div>

       
        <div class="projects-grid" id="projectsGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
            Tidak ada proyek yang ditemukan
        </div>
    </div>

    <script>

{ num: 60, name: "CoffeeShopMenu", desc: "Menu kopi dengan gambar dan harga" },

        ];

        function getProjectPath(num, name) {
            const folderRange = Math.floor((num - 1) / 20) * 20 + 1;
            const folderEnd = folderRange + 19;
            const folder = `${String(folderRange).padStart(3, '0')}-${String(folderEnd).padStart(3, '0')}`;
            
            // Convert CamelCase to snake_case
            const snakeCaseName = name
                .replace(/([A-Z])/g, '_$1')
                .toLowerCase()
                .replace(/^_/, '');
            
            const kebabCaseName = name
    .replace(/([A-Z])/g, '-$1')    // Ganti _ jadi -
    .toLowerCase()
    .replace(/^-/, '');
            
            return `/flutter/${folder}/${snakeCaseName}/w`;
        }

        function renderProjects(filteredProjects) {
            const grid = document.getElementById('projectsGrid');
            const noResults = document.getElementById('noResults');
            
            if (filteredProjects.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            
            grid.innerHTML = filteredProjects.map(project => `
                <a href="${getProjectPath(project.num, project.name)}" class="project-card">
                    <div class="project-number">#${String(project.num).padStart(3, '0')}</div>
                    <div class="project-name">${project.name}</div>
                    <div class="project-description">${project.desc}</div>
                </a>
            `).join('');
        }

        function filterProjects() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = projects.filter(project => 
                project.name.toLowerCase().includes(searchTerm) ||
                project.desc.toLowerCase().includes(searchTerm) ||
                String(project.num).includes(searchTerm)
            );
            renderProjects(filtered);
        }

        renderProjects(projects);
    </script>
</body>
</html>
