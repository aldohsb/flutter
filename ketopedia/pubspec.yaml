name: ketopedia
description: Aplikasi pendamping diet keto dengan tracking dan edukasi lengkap
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Database - HIVE (Web Compatible)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Storage
  shared_preferences: ^2.3.2
  
  # CSV Export
  csv: ^6.0.0
  share_plus: ^10.0.2
  
  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  
  # Charts
  fl_chart: ^0.69.0
  
  # Notifications (akan disabled di web)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"