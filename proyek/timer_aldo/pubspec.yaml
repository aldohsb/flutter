name: timer_aldo
description: Professional timer with idle detection and system tray
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Window Management
  window_manager: ^0.4.2
  screen_retriever: ^0.1.9
  
  # System Tray
  system_tray: ^2.0.3
  
  # Hotkey/Shortcut
  hotkey_manager: ^0.2.3
  
  # UI Components
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utils - FIXED: Use uuid 3.x untuk kompatibilitas dengan system_tray
  intl: ^0.19.0
  uuid: ^3.0.7
  collection: ^1.18.0
  path_provider: ^2.1.4
  
  # FFI for Windows API
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/