name: al_timer
description: Advanced timer app with activity detection, system tray, and statistics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.5
  
  # System Integration
  system_tray: ^2.0.3
  hotkey_manager: ^0.2.3
  window_manager: ^0.4.2
  
  # Activity Detection
  win32: ^5.7.1
  ffi: ^2.1.3
  
  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  
  # Utils
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/