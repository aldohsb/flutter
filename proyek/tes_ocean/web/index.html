<!DOCTYPE html>
<html lang="id">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Tes kepribadian OCEAN (Big Five) dengan dukungan multi profil pengguna.">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Tes OCEAN">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Tes OCEAN - Tes Kepribadian Big Five</title>
    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #F7F7FB;
        }
        #loading-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F7F7FB;
        }
        #loading-splash .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E5E7EB;
            border-top-color: #4338CA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-splash">
        <div class="spinner"></div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
