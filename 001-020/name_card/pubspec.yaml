# =============================================================
# pubspec.yaml — Konfigurasi Proyek NameCard
# Hari 2: Widget Dasar — Text, Container, Icon
# =============================================================

name: name_card
# Nama package (lowercase, underscore) — bukan nama yang tampil di HP

description: "Kartu nama digital pribadi — latihan Text, Container, Icon."

publish_to: 'none'
# Mencegah publish ke pub.dev secara tidak sengaja

version: 1.0.0+1
# Format: versi_tampilan+build_number
# Build number harus naik setiap submit ke Play Store / App Store

environment:
  sdk: ^3.5.0
  # Dart SDK minimum 3.5.0 (bundled dengan Flutter stable terbaru 2025-2026)

dependencies:
  flutter:
    sdk: flutter
  # Dependency utama Flutter — wajib selalu ada

  google_fonts: ^6.2.1
  # Package untuk menggunakan font Google Fonts (Poppins, Lato, dll.)
  # Tanpa perlu download manual — diambil otomatis dari internet saat build
  # Dokumentasi: pub.dev/packages/google_fonts

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Package testing Flutter — wajib ada untuk unit test

  flutter_lints: ^5.0.0
  # Linter resmi: mengingatkan jika ada kode yang kurang idiomatis/rapi

flutter:
  uses-material-design: true
  # Aktifkan ikon Material Design (Icons.phone, Icons.email, dll.)
  # WAJIB true jika menggunakan widget Icons.*

  assets:
    - assets/images/
    # Daftarkan seluruh folder assets/images/
    # Flutter harus tahu di mana aset berada sebelum bisa memuatnya