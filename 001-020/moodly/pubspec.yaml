# ============================================================
# pubspec.yaml – Konfigurasi utama proyek Flutter
# File ini seperti "kartu identitas + daftar belanja" proyek.
# Dart/Flutter membaca file ini untuk tahu nama proyek,
# versi, dan library apa saja yang dibutuhkan.
# ============================================================

name: moodly
description: "Moodly – Daily Mood Tracker with Emoji, Claymorphism UI"

# Versi app: format MAJOR.MINOR.PATCH+BUILD_NUMBER
# Contoh: 1.0.0+1 → versi 1.0.0, build ke-1
publish_to: 'none'
version: 1.0.0+1

# Versi minimum Dart & Flutter SDK yang dibutuhkan
environment:
  sdk: '>=3.4.0 <4.0.0'

# ============================================================
# DEPENDENCIES – Library pihak ketiga yang kita pakai
# Cari versi terbaru di: pub.dev
# ============================================================
dependencies:
  flutter:
    sdk: flutter

  # SharedPreferences – menyimpan data sederhana di device
  # Seperti "catatan kecil" yang tidak hilang saat app ditutup
  shared_preferences: ^2.3.2

  # fl_chart – library grafik/chart yang cantik untuk Flutter
  # Dipakai di ChartScreen untuk visualisasi data mood
  fl_chart: ^0.69.0

  # provider – state management resmi dari Flutter team
  # Menghubungkan data ke UI tanpa setState yang berantakan
  provider: ^6.1.2

  # intl – formatting tanggal & waktu (misal: "Senin, 18 Jun 2026")
  intl: ^0.19.0

  # google_fonts – akses ratusan font Google langsung dari kode
  google_fonts: ^6.2.1

# ============================================================
# DEV DEPENDENCIES – Hanya untuk development, tidak ikut build
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ============================================================
# FLUTTER CONFIG – Konfigurasi aset & font
# ============================================================
flutter:
  uses-material-design: true

  # Assets – file gambar/data yang dibundle dalam app
  # Kita tidak pakai aset eksternal, semua dari code & Google Fonts