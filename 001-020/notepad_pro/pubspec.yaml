name: notepad_pro
description: A professional note-taking app with rich text editor, folders, and tags
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  fonts:
    - family: Caveat
      fonts:
        - asset: fonts/Caveat-Regular.ttf
        - asset: fonts/Caveat-Bold.ttf
          weight: 700
    - family: PatrickHand
      fonts:
        - asset: fonts/PatrickHand-Regular.ttf