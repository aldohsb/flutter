name: calorie_track
description: A food calorie counter application with daily nutrition tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Charts
  fl_chart: ^0.69.2
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Date handling
  intl: ^0.19.0
  
  # Local storage
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/