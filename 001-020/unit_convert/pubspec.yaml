name: unit_convert
description: "Universal Unit Converter - Convert berbagai unit dengan mudah"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Dependencies adalah library yang kita butuhkan untuk proyek
dependencies:
  flutter:
    sdk: flutter

  # Provider - untuk state management (mengelola data di seluruh aplikasi)
  # Versi terbaru di 2025
  provider: ^6.1.2
  
  # Math expressions - untuk menghitung operasi matematika kompleks
  math_expressions: ^2.6.0
  
  # HTTP - untuk request API currency
  http: ^1.2.2
  
  # Shared preferences - untuk menyimpan data lokal (seperti history)
  shared_preferences: ^2.3.3
  
  # Intl - untuk formatting angka dan currency
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true