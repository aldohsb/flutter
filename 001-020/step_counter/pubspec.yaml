name: step_counter
description: A professional pedometer and step tracker app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Storage
  shared_preferences: ^2.3.3
  
  # Step Counter (Mobile only)
  pedometer: ^4.0.2
  
  # Permission (Mobile only)
  permission_handler: ^11.3.1
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true