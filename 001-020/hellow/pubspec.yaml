name: hellow
description: "Hellow - A beautiful Hello World app"
# Nama dan deskripsi proyek, muncul di app store dan metadata

publish_to: 'none'
# Mencegah proyek ini diunggah ke pub.dev secara tidak sengaja

version: 1.0.0+1
# Format: major.minor.patch+buildNumber
# Bagian setelah '+' adalah versionCode untuk Android

environment:
  sdk: '>=3.5.0 <4.0.0'
# Minimum versi Dart SDK yang diperlukan
# Dart 3.5+ hadir dengan Flutter 3.24+

dependencies:
  flutter:
    sdk: flutter
  # Flutter SDK itu sendiri, selalu diperlukan

  google_fonts: ^6.2.1
  # Akses ke ratusan font Google langsung dari kode
  # Kita akan pakai font Poppins untuk tampilan modern

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Paket testing bawaan Flutter

  flutter_lints: ^5.0.0
  # Aturan linting terbaru untuk kode yang lebih bersih

flutter:
  uses-material-design: true
  # Mengaktifkan ikon Material Design bawaan Flutter