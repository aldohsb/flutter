# =============================================================
# pubspec.yaml — File konfigurasi utama project Flutter
# Anggap ini seperti "KTP"-nya aplikasimu
# Semua informasi tentang app dan dependencies ada di sini
# =============================================================

name: hello_flutter
# Nama package project (huruf kecil, gunakan underscore, bukan spasi)
# Ini bukan nama yang tampil di HP — itu diatur di android/app/src/main/AndroidManifest.xml

description: "Aplikasi Flutter pertama — menampilkan profil sederhana."
# Deskripsi singkat project, bebas diisi apa saja

# Mencegah publish tidak sengaja ke pub.dev (repository package Dart publik)
publish_to: 'none'

version: 1.0.0+1
# Format: versi_nama+versi_build
# 1.0.0 = versi yang tampil ke pengguna (major.minor.patch)
# +1    = build number, harus naik setiap kali submit ke Play Store / App Store

environment:
  sdk: ^3.5.0
  # Versi minimum Dart SDK yang dibutuhkan project ini
  # Tanda ^ berarti "3.5.0 ke atas, tapi masih seri 3.x"
  # Per 2025-2026, Flutter stable sudah bundled dengan Dart 3.5+

dependencies:
  flutter:
    sdk: flutter
  # flutter adalah dependency utama — wajib ada
  # sdk: flutter artinya diambil dari Flutter SDK yang sudah terinstall, bukan dari pub.dev

  # google_fonts: ^6.2.1
  # Uncomment baris di atas jika ingin menggunakan font Google Fonts
  # Untuk Hari 1, kita tidak membutuhkan package tambahan

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Package untuk unit testing — sudah ada secara default

  flutter_lints: ^5.0.0
  # Linter resmi Flutter: memberikan peringatan jika ada kode yang kurang baik
  # Sangat disarankan tetap ada agar kode kamu rapi sejak awal

flutter:
  uses-material-design: true
  # Mengaktifkan ikon Material Design bawaan Flutter (Icons.person, Icons.home, dll.)
  # Tanpa ini, kamu tidak bisa pakai widget Icons.*

  assets:
    - assets/images/
    # Mendaftarkan FOLDER assets/images/ agar Flutter tahu di mana gambar disimpan
    # Tanda / di akhir = daftarkan semua file dalam folder itu
    # PENTING: Tanpa baris ini, Image.asset() akan error walau file sudah ada
    #
    # Jika ingin daftarkan file spesifik saja (bukan seluruh folder):
    # assets:
    #   - assets/images/profile.png
    #   - assets/images/logo.png